<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{TITLE}}</title>
    <style>
        @page {
            size: A4;
            margin: 20mm;
            @bottom-right {
                content: "Page " counter(page) " of " counter(pages);
                font-family: 'Inter', -apple-system, sans-serif;
                font-size: 8pt;
                color: #718096;
            }
            @bottom-left {
                content: "Executive Studies & Research — Confidential";
                font-family: 'Inter', -apple-system, sans-serif;
                font-size: 8pt;
                color: #718096;
                font-weight: 500;
            }
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #2D3748;
            line-height: 1.6;
            font-size: 10pt;
            margin: 0;
            padding: 0;
        }

        .header-container {
            border-bottom: 3px solid #0F2942;
            padding-bottom: 18px;
            margin-bottom: 25px;
        }

        .category-tag {
            font-size: 8.5pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #2F855A;
            margin-bottom: 6px;
        }

        .title {
            font-size: 22pt;
            color: #0F2942;
            margin: 0 0 8px 0;
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 10.5pt;
            color: #4A5568;
            margin: 0;
            font-style: italic;
            font-weight: 400;
            line-height: 1.5;
        }

        .metadata {
            margin-top: 12px;
            font-size: 8pt;
            color: #718096;
            font-weight: 500;
        }

        h2 {
            font-size: 13pt;
            color: #0F2942;
            margin-top: 25px;
            margin-bottom: 10px;
            border-bottom: 1px solid #CBD5E0;
            padding-bottom: 4px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h3 {
            font-size: 10.5pt;
            color: #2F855A;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        p {
            margin-top: 0;
            margin-bottom: 12px;
            text-align: justify;
        }

        blockquote {
            border-left: 4px solid #0F2942;
            background-color: #F8FAFC;
            padding: 10px 15px;
            margin: 15px 0;
            font-style: italic;
            color: #1A202C;
            border-radius: 0 4px 4px 0;
            font-size: 9pt;
            line-height: 1.5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 8.5pt;
        }

        th {
            background-color: #0F2942;
            color: white;
            font-weight: 600;
            text-align: left;
            padding: 6px 8px;
            border: 1px solid #0F2942;
        }

        td {
            padding: 6px 8px;
            border: 1px solid #E2E8F0;
            vertical-align: top;
        }

        tr:nth-child(even) {
            background-color: #F8FAFC;
        }

        .metric-cell {
            text-align: right;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        .highlight-box {
            background-color: #F0FDF4;
            border-left: 4px solid #2F855A;
            padding: 12px 15px;
            margin: 15px 0;
            border-radius: 0 4px 4px 0;
        }

        .highlight-title {
            font-weight: 700;
            color: #2F855A;
            margin-bottom: 4px;
            font-size: 10pt;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="category-tag">{{CATEGORY_TAG}}</div>
        <h1 class="title">{{TITLE}}</h1>
        <p class="subtitle">{{SUBTITLE}}</p>
        <div class="metadata">
            Author: {{AUTHOR_NAME}} &bull; Sector: {{SECTOR}} &bull; Date: {{DATE}}
        </div>
    </div>

    {{CONTENT}}

</body>
</html>
